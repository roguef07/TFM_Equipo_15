version: '3.9'

services:

  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1

  postgres:
    image: postgres:16
    container_name: postgres_dw
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: retail_dw
    ports:
      - "5432:5432"

  spark:
    image: apache/spark:3.5.1
    container_name: spark_engine
    tty: true
